name: CPU core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check src tests scripts examples
      - run: python -m pytest
      - run: python scripts/check_source_release.py
      - run: ard toolkit-demo --output runs/ci-toolkit
      - run: ard demo --offline --output runs/ci-demo
      - run: ard audit --input runs/ci-demo
      - run: ard budgetmix plan --task-ids configs/examples/budgetmix_task_ids.json --tmax 24 --group-size 8 --output runs/ci-budgetmix
      - run: ard budgetmix audit --input runs/ci-budgetmix
      - run: ard compare --input runs/ci-demo --labels Synthetic --output runs/ci-comparison
      - run: ard likelihood analyze --base examples/likelihood/base-scores.json --rl examples/likelihood/rl-scores.json --token-caliper 0.2 --step-caliper 1 --output runs/ci-likelihood
      - run: python examples/process_signal_training.py --coefficient 0.5
      - run: python examples/external_scorer.py
      - run: ard traces import --input examples/external-traces/base.jsonl --design examples/external-traces/design.json --label base --output runs/ci-traces-base
      - run: ard traces import --input examples/external-traces/candidate.jsonl --design examples/external-traces/design.json --label candidate --output runs/ci-traces-candidate
      - run: ard traces audit --input runs/ci-traces-base
      - run: ard traces compare --base runs/ci-traces-base --candidate runs/ci-traces-candidate --min-delta 0 --output runs/ci-traces-comparison
      - run: python examples/dynamics_fixture.py --output runs/ci-dynamics-fixture
      - run: python scripts/verify_process_signal_cpu.py --help
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,inspect]'
      - run: python -m pytest tests/test_inspect_logs.py -q
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m venv /tmp/ard-clean
      - run: /tmp/ard-clean/bin/python -m pip install --no-index --no-deps dist/*.whl
      - run: cd /tmp && /tmp/ard-clean/bin/ard demo --offline --output /tmp/ard-wheel-demo
      - run: cd /tmp && /tmp/ard-clean/bin/ard toolkit-demo --output /tmp/ard-wheel-toolkit
      - run: /tmp/ard-clean/bin/ard audit --input /tmp/ard-wheel-demo
      - run: /tmp/ard-clean/bin/ard budgetmix plan --task-ids configs/examples/budgetmix_task_ids.json --tmax 24 --output /tmp/ard-wheel-budgetmix
      - run: cd /tmp && /tmp/ard-clean/bin/ard budgetmix audit --input /tmp/ard-wheel-budgetmix
      - run: /tmp/ard-clean/bin/ard compare --input /tmp/ard-wheel-demo --labels Synthetic --output /tmp/ard-wheel-comparison
      - run: /tmp/ard-clean/bin/ard likelihood analyze --base examples/likelihood/base-scores.json --rl examples/likelihood/rl-scores.json --token-caliper 0.2 --step-caliper 1 --output /tmp/ard-wheel-likelihood
      - run: python scripts/check_release_archive.py dist/agent_rl_diagnostics-*.whl
      - run: python -m pip install "setuptools>=68" wheel
      - run: python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
      - run: python scripts/check_release_archive.py dist/agent_rl_diagnostics-*.tar.gz
