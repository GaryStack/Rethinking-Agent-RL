[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rl-diagnostics"
version = "0.1.0.dev11"
description = "Budget and decision-quality diagnostics for multi-turn agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.275"]
dev = ["pytest>=8,<10", "ruff==0.11.13"]
hf = ["torch>=2.6,<3", "transformers>=4.57,<5"]
tracking = ["wandb>=0.25,<0.26"]
actor-smoke = ["torch>=2.6,<3", "transformers>=4.57,<5", "peft>=0.18,<0.19", "numpy>=1.26", "wandb>=0.25,<0.26"]

[project.scripts]
ard = "agent_rl_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_rl_diagnostics = ["py.typed", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
